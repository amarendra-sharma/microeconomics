name: Deploy im-grade-attempt
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['im-diagrams.js', 'im-generators.js', 'im-econ160.js', 'tools/**', 'supabase/config.toml', '.github/workflows/deploy-im-grade-attempt.yml']
concurrency: deploy-im-grade-attempt
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: rtaiivegcqqmdchpguzn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/check_engine.js
      - run: python3 tools/build_im_grade_attempt.py
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy im-grade-attempt --project-ref "$PROJECT_REF" --no-verify-jwt --yes
